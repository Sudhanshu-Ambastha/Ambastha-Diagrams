<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ambastha Diagram Editor</title>
    <link rel="icon" type="image/svg+xml" href="../../resources/logo.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <input type="color" id="colorPicker" style="display: none" />

    <div class="sidebar">
      <label for="exampleSelector">Templates & Examples</label>
      <select id="exampleSelector">
        <option value="">-- Load an Example --</option>
      </select>

      <label for="editor">Source Input (.abd)</label>
      <textarea id="editor" spellcheck="false">
class
struct User {
    +string id
    +string email
    -string password
    +getSession()
}

struct Customer {
    +string name
    +string billingAddress
    +signUp()
    +login()
}

struct Order {
    +string id
    +date orderDate
    +string status
    +updateStatus()
}

struct Logger {
    +log()
}

struct PaymentGateway {
    +processPayment()
    +refund()
}

inherits: Customer --> User
composition: Order --> Customer
dependency: Order --> Logger; Order --> PaymentGateway
  </textarea
      >
    </div>

    <div id="preview" class="canvas"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
