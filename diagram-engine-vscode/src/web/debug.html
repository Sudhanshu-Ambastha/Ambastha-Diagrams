<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Engine Debug</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #111;
        color: #0f0;
        font-size: 13px;
      }
      .err {
        color: #f87171;
      }
      .ok {
        color: #4ade80;
      }
      .info {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <h2 style="color: #fff">Engine Export Shape Debugger</h2>
    <pre id="out">Loading engine.js ...</pre>
    <script src="./dist/web/engine.js"></script>
    <script>
      var out = document.getElementById("out");
      function log(msg, cls) {
        var line = document.createElement("div");
        line.className = cls || "info";
        line.textContent = msg;
        out.appendChild(line);
      }
      out.textContent = "";

      log("--- window.DiagramEngine inspection ---");
      var e = window.DiagramEngine;
      if (!e) {
        log("FAIL: window.DiagramEngine is undefined", "err");
        log(
          'Check webpack output — library.name must be "DiagramEngine", library.type must be "window"',
          "err",
        );
      } else {
        log("OK: window.DiagramEngine exists", "ok");
        log("typeof DiagramEngine = " + typeof e);
        log("Keys: " + JSON.stringify(Object.keys(e)));
        log("typeof .renderDiagram = " + typeof e.renderDiagram);
        log("typeof .default = " + typeof e.default);
        if (e.default)
          log(
            "Keys on .default: " + JSON.stringify(Object.keys(e.default || {})),
          );

        // Try all resolution paths
        var fn =
          e.renderDiagram ||
          (e.default && e.default.renderDiagram) ||
          (typeof e.default === "function" && e.default) ||
          (typeof e === "function" && e);

        if (typeof fn === "function") {
          log(
            "OK: renderDiagram resolved as: " + fn.toString().slice(0, 80),
            "ok",
          );
          try {
            var result = fn('flowchart\n  process "Hello" as A');
            log(
              "OK: renderDiagram returned " +
                typeof result +
                " (" +
                (result || "").length +
                " chars)",
              "ok",
            );
            if (result) {
              document.body.insertAdjacentHTML(
                "beforeend",
                '<div style="margin-top:20px;border:1px solid #333;padding:10px">' +
                  result +
                  "</div>",
              );
            }
          } catch (ex) {
            log("FAIL: renderDiagram threw: " + ex.message, "err");
          }
        } else {
          log("FAIL: could not find renderDiagram function anywhere", "err");
          log("Full DiagramEngine dump: " + JSON.stringify(e, null, 2));
        }
      }
    </script>
  </body>
</html>
